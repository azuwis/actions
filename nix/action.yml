name: Install Nix and setup cache
inputs:
  nix_conf:
    description: nix.conf config
    default: |
      accept-flake-config = true
      experimental-features = nix-command flakes
      http2 = false
      keep-derivations = true
      keep-outputs = true
  extra_nix_conf:
    description: Extra nix.conf config, appended to nix_conf
    default: ""
  key:
    description: Key to actions/cache
    default: nix
  use_nixpkgs_in_flake:
    description: Use nixpkgs defined in flake.nix
    default: true
  nixpkgs_url:
    description: Nixpkgs URL, or a release version in `YY.MM` form which expands to https://channels.nixos.org/nixos-YY.MM, or https://channels.nixos.org/nixpkgs-YY.MM-darwin on macOS. Empty skips nix-channel setup
    default: "26.05"
  clean:
    description: Clean up disk space
    default: false
  btrfs:
    description: Use BTRFS to setup RAID0
    default: false
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CLEAN: ${{ inputs.clean }}
        BTRFS: ${{ inputs.btrfs }}
      run: exec ${{ github.action_path }}/prepare.sh
    - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
      with:
        extra-conf: |
          ${{ runner.os == 'macOS' && 'sandbox = relaxed' || '' }}
          ${{ inputs.nix_conf }}
          ${{ inputs.extra_nix_conf }}
    - name: Nix restore pre
      shell: bash
      env:
        CACHE_KEY: ${{ inputs.key }}
      run: exec ${{ github.action_path }}/restore.sh pre
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ env.CACHE_KEY }}-${{ env.CURRENT_SYSTEM }}-${{ env.CACHE_TIMESTAMP }}
        restore-keys: |
          ${{ env.CACHE_KEY }}-${{ env.CURRENT_SYSTEM }}
        path: |
          /nix/store
          /nix/var/nix/db
          /nix/var/nix/gcroots
          /nix/var/nix/profiles
          ~/.cache/nix
          ~/.local/state/nix
          ~/.nix-channels
          ~/.nix-defexpr
    - name: Nix restore post
      shell: bash
      env:
        USE_NIXPKGS_IN_FLAKE: ${{ inputs.use_nixpkgs_in_flake }}
        NIXPKGS_URL: ${{ !contains(inputs.nixpkgs_url, '/') && contains(inputs.nixpkgs_url, '.') && format(runner.os == 'macOS' && 'https://channels.nixos.org/nixpkgs-{0}-darwin' || 'https://channels.nixos.org/nixos-{0}', inputs.nixpkgs_url) || inputs.nixpkgs_url }}
      run: exec ${{ github.action_path }}/restore.sh post
